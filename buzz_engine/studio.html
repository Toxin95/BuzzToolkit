<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buzz Pack Studio</title>
<style>
:root{
  --ground:#F3F4F8; --panel:#FFFFFF; --ink:#151A2B; --muted:#5C6378; --rule:#DCDFE8; --soft:#EEF0F5;
  --red:#D7263D; --red-ink:#FFFFFF; --red-soft:#FBE5E8;
  --blue:#2F6BE0; --orange:#EE8416; --green:#23A057; --yellow:#E2B007;
  --ok:#1E8E4E; --ok-bg:#E3F4EA; --warn:#A8620A; --warn-bg:#FCEFDB; --bad:#B42336; --bad-bg:#FBE4E7;
  --shadow:0 1px 2px rgba(21,26,43,.06),0 4px 16px rgba(21,26,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F121B; --panel:#171B27; --ink:#E8EBF3; --muted:#9BA3B7; --rule:#2A3044; --soft:#1F2434;
  --red:#F04A5E; --red-soft:#3A1B22; --blue:#6B9BFF; --orange:#F7A04B; --green:#4CC57D; --yellow:#EDC540;
  --ok:#4CC57D; --ok-bg:#16301F; --warn:#F0A54B; --warn-bg:#35270F; --bad:#FF6B7D; --bad-bg:#3A1B22;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0F121B; --panel:#171B27; --ink:#E8EBF3; --muted:#9BA3B7; --rule:#2A3044; --soft:#1F2434;
  --red:#F04A5E; --red-soft:#3A1B22; --blue:#6B9BFF; --orange:#F7A04B; --green:#4CC57D; --yellow:#EDC540;
  --ok:#4CC57D; --ok-bg:#16301F; --warn:#F0A54B; --warn-bg:#35270F; --bad:#FF6B7D; --bad-bg:#3A1B22;
  --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;margin:0;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--rule);padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.buzzer{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a97,var(--red) 55%,#8e1224);box-shadow:0 3px 0 #6d0f1c;flex:none}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.plist{display:flex;flex-direction:column;gap:4px}
.plist button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px}
.plist button:hover{background:var(--soft)}
.plist button.on{background:var(--red-soft);color:var(--ink);font-weight:600}
.plist .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:.88rem}
main{padding:28px 32px 80px;display:flex;flex-direction:column;gap:22px;max-width:1080px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h2{font-size:1.9rem;font-weight:800}
.head .sub{color:var(--muted)}
.step{background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.step>header{display:flex;align-items:center;gap:12px}
.num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.step>header h3{font-size:1.15rem;font-weight:700}
.step>header .hint{color:var(--muted);font-size:.9rem;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--ground);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.go{background:var(--red);color:var(--red-ink);border:0;padding:14px 30px;font-size:1.1rem;border-radius:999px;box-shadow:0 4px 0 #7e1020}
.btn.go:active{transform:translateY(3px);box-shadow:0 1px 0 #7e1020}
.btn.go:disabled{opacity:.55;cursor:progress}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.ok{color:var(--ok);background:var(--ok-bg)} .low{color:var(--warn);background:var(--warn-bg)} .none{color:var(--bad);background:var(--bad-bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule)}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.drop{border:2px dashed var(--rule);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--soft)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{display:flex;align-items:center;gap:8px;background:var(--ground);border:1px solid var(--rule);border-radius:10px;padding:4px 8px 4px 4px}
.ans .dot{width:22px;height:22px;border-radius:50%;flex:none}
.ans input[type=text]{border:0;background:transparent;padding:6px 2px}
.ans .cnt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ans.correct{outline:2px solid var(--ok)}
.d0{background:var(--blue)}.d1{background:var(--orange)}.d2{background:var(--green)}.d3{background:var(--yellow)}
.cnt.over{color:var(--bad);font-weight:700}
.qtable{width:100%;border-collapse:collapse;font-size:.9rem}
.qwrap{max-height:420px;overflow:auto;border:1px solid var(--rule);border-radius:10px}
.qtable th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 10px}
.qtable td{border-top:1px solid var(--rule);padding:7px 10px;vertical-align:top}
.qtable td.a span{display:inline-block;margin:0 10px 2px 0}
.qtable td.a span:first-child{color:var(--ok);font-weight:600}
.qtable img{height:38px;border-radius:4px;vertical-align:middle;margin-right:4px}
.track{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.card{background:var(--ground);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;min-width:170px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.card .tools button{all:unset;cursor:pointer;padding:0 4px;color:var(--muted)}
.card .tools button:hover{color:var(--ink)}
.card.fixed{background:var(--soft);border-style:dashed;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:2px 9px;font-size:.8rem;cursor:pointer;background:var(--panel)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.dim{opacity:.45;text-decoration:line-through}
.warn{color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px;font-size:.9rem}
.status{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.status div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;padding:6px 10px;border-radius:8px;background:var(--ground)}
.log{background:#0F1320;color:#D6DBEA;border-radius:10px;padding:12px 14px;font:13px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:260px;overflow:auto}
.result{border:2px solid var(--ok);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.result code{font:13px ui-monospace,Consolas,monospace;word-break:break-all}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;max-width:420px;box-shadow:var(--shadow);z-index:10}
.toast.err{background:var(--bad);color:#fff}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--red)}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--rule)}main{padding:20px 16px 60px}.answers{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="buzzer" aria-hidden="true"></div><div><h1>Buzz Pack Studio</h1><small><span data-t="Custom quiz packs for Buzz! Quiz World"></span> <span id="ver"></span></small></div></div>
  <label class="row" style="gap:8px;font-size:.85rem"><span aria-hidden="true">🌐</span><select id="uilang" aria-label="Language / Lingua" style="flex:1"></select></label>
  <button class="btn" id="srvbtn" style="justify-content:space-between;display:flex;align-items:center"><span data-t="Online server"></span><span class="pill" id="srvpill">…</span></button>
  <button class="btn" id="bbbtn" style="justify-content:space-between;display:flex;align-items:center"><span data-t="Big Button buzzers"></span><span class="pill" id="bbpill">…</span></button>
  <div class="label" data-t="Your packs"></div>
  <div class="plist" id="plist"></div>
  <form id="newform" class="row" style="gap:6px">
    <input type="text" id="newtitle" data-tp="New pack name" style="flex:1;min-width:0">
    <button class="btn primary small" type="submit" data-t="Create"></button>
  </form>
  <div class="side-foot">
    <div class="label" data-t="Setup"></div>
    <label class="f"><span data-t="RPCS3 folder"></span><input type="text" id="rpcs3" data-tp="folder containing rpcs3.exe"></label>
    <button class="btn small" id="saverpcs3" data-t="Save folder"></button>
    <div id="gamesbox" style="margin-top:.4rem"></div>
    <div id="updbox"></div>
    <div id="ffbox"></div>
    <div id="keysbox"></div>
    <div id="hookbox"></div>
    <div id="voicebox" class="muted"></div>
  </div>
</aside>
<main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/studio_i18n.js"></script>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = null, P = null, qtab = "import", addKind = "standard", qfilter = "all", job = null, lastResult = null, page = "home", editing = null;
const OTQA = ["general","animals","brain-teasers","celebrities","entertainment","for-kids","geography","history","hobbies","humanities","literature","movies","music","newest","people","rated","religion-faith","science-technology","sports","television","video-games","world"];
const KINDS = {standard:"Standard", picture:"Picture", all_that_apply:"All That Apply", point_stealer:"Point Stealer"};

// ---------- interface language (studio_i18n.js): English text is the key, missing entries stay English
let LANG = "en";
try { LANG = localStorage.getItem("studio-lang") || ""; } catch(e) { LANG = ""; }
if (!STUDIO_LANGS[LANG]) LANG = (navigator.language||"en").slice(0,2).toLowerCase();
if (!STUDIO_LANGS[LANG]) LANG = "en";
function T(s, ...args){ const d = I18N[LANG]; const t = (d && d[s]) || s; return t.replace(/\{(\d+)\}/g, (m,i)=> args[i] ?? m); }
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent = T(e.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(e=>{ e.placeholder = T(e.dataset.tp); e.setAttribute("aria-label", T(e.dataset.tp)); });
  const sel = $("#uilang");
  sel.innerHTML = Object.entries(STUDIO_LANGS).map(([k,v])=>`<option value="${k}" ${k===LANG?"selected":""}>${esc(v)}</option>`).join("");
}
function home(){ page = "home"; $("#main").innerHTML = `<div class="empty">${esc(T("Create a pack on the left, or pick one to keep working on it."))}</div>`; }
$("#uilang").onchange = e=>{
  LANG = e.target.value; try { localStorage.setItem("studio-lang", LANG); } catch(err) {}
  applyStatic(); renderSide(); srvPill(); bbPill();
  if (page==="project" && P) render(); else if (page==="server") renderServer(); else if (page==="buzzers") renderBuzzers(); else home();
};
applyStatic(); home();

function toast(msg, err=false){const t=$("#toast");t.textContent=msg;t.className="toast"+(err?" err":"");t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,err?7000:3500);}
async function api(path, body){
  const r = await fetch(path, body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json(); if(!r.ok || j.error){toast(j.error||T("Something went wrong"), true); throw new Error(j.error);} return j;
}
const readFile = f => new Promise(res=>{const r=new FileReader();r.onload=()=>res({name:f.name,data:r.result});r.readAsDataURL(f);});

async function loadState(){ S = await api("/api/state"); renderSide(); }
function renderSide(){
  if(!S) return;
  $("#ver").textContent = S.version ? "· v" + S.version : "";
  $("#plist").innerHTML = S.projects.length ? S.projects.map(p=>`<button class="${P&&P.id===p.id?"on":""}" data-id="${p.id}"><span>${esc(p.title)}</span><span class="n">#${p.number} · ${p.questions}q</span></button>`).join("") : `<span class="muted">${esc(T("No packs yet."))}</span>`;
  $("#plist").querySelectorAll("button").forEach(b=>b.onclick=()=>openProject(b.dataset.id));
  $("#rpcs3").value = S.rpcs3 || "";
  $("#hookbox").innerHTML = S.hook ? `<span class="pill ok">${esc(T("Custom running orders on"))}</span>` :
    `<button class="btn small" id="hookbtn">${esc(T("Turn on custom running orders"))}</button><div class="muted" style="font-size:.8rem">${esc(T("One-time change to your game's scripts (backed up): each pack plays its own rounds in the Pack Game menu."))}</div>`;
  const hb = $("#hookbtn"); if(hb) hb.onclick = async()=>{ S = await api("/api/hook",{}); renderSide(); toast(T("Custom running orders enabled")); };
  const U = S.update || {};
  const gb = $("#gamesbox");
  if (gb) gb.innerHTML = !S.rpcs3 ? "" : (S.games && S.games.length)
    ? S.games.map(g=>`<span class="pill ok">${esc(g.name)}</span>`).join(" ")
    : `<div class="muted" style="font-size:.8rem">${esc(T("No Buzz DLC folder in this RPCS3 yet - it is created when you send a pack."))}</div>`;
  $("#updbox").innerHTML = !S.rpcs3 ? "" : U.ok ? `<span class="pill ok">${esc(T("Game update {0} installed", U.want))}</span>` :
    `<div class="warn" style="font-size:.85rem">${esc(U.installed ? T("Game update {0} needed (you have {1}). The toolkit is built on it.", U.want, U.installed) : T("Game update {0} not installed. The toolkit is built on it.", U.want))}</div>` +
    (U.downloaded ? `<button class="btn small" id="updinst">${esc(T("Install update into RPCS3"))}</button><div class="muted" style="font-size:.8rem">${esc(T("Close RPCS3 first. RPCS3's own installer opens; when it's done, press Save folder to re-check."))}</div>`
                  : `<button class="btn small" id="upddl">${esc(T("Download update from Sony"))}</button><div class="muted" style="font-size:.8rem">${esc(T("Fetches the official {0} update (22 MB) straight from Sony's PS3 update server and checks it.", U.want))}</div>`);
  const ud = $("#upddl"); if(ud) ud.onclick = async()=>{ ud.disabled=true; ud.textContent=T("Downloading…"); try{ S = await api("/api/update",{}); renderSide(); toast(T("Update downloaded")); }catch(e){ ud.disabled=false; ud.textContent=T("Download update from Sony"); } };
  const ui = $("#updinst"); if(ui) ui.onclick = async()=>{ await api("/api/update",{op:"install"}); toast(T("RPCS3's installer is opening")); };
  $("#ffbox").innerHTML = S.ffmpeg ? `<span class="pill ok">${esc(T("ffmpeg found"))}</span>` :
    `<button class="btn small" id="ffbtn">${esc(T("Download ffmpeg"))}</button><div class="muted" style="font-size:.8rem">${esc(T("Needed to build packs (pictures, audio). Free LGPL build, about 100 MB, saved inside the toolkit."))}</div>`;
  const fb = $("#ffbtn"); if(fb) fb.onclick = async()=>{ fb.disabled=true; fb.textContent=T("Downloading…"); try{ S = await api("/api/ffmpeg",{}); renderSide(); toast(T("ffmpeg ready")); }catch(e){ fb.disabled=false; fb.textContent=T("Download ffmpeg"); } };
  $("#keysbox").innerHTML = S.keys_ready ? `<span class="pill ok">${esc(T("Game keys read from your EBOOT"))}</span>` :
    `<label class="f">${esc(T("Your decrypted EBOOT (.elf)"))}<input type="text" id="ebootk" placeholder="RPCS3: Utilities → Decrypt PS3 Binaries"></label><button class="btn small" id="keysbtn">${esc(T("Read game keys"))}</button><div class="muted" style="font-size:.8rem">${esc(T("Needed once: packs are encrypted with the game's own key, which the toolkit doesn't ship."))}</div>`;
  const kb = $("#keysbtn"); if(kb) kb.onclick = async()=>{ S = await api("/api/keys",{eboot:$("#ebootk").value.trim()}); renderSide(); toast(T("Game keys read")); };
  $("#voicebox").textContent = T("Host voices: ") + (S.voices.length ? S.voices.map(v=>`${v.lang}${v.trained?T(" (trained)"):""}`).join(", ") : T("none yet"));
}
$("#saverpcs3").onclick = async()=>{ S = await api("/api/settings",{rpcs3:$("#rpcs3").value.trim()}); renderSide(); toast(T("RPCS3 folder saved")); };
$("#newform").onsubmit = async e=>{ e.preventDefault(); const t=$("#newtitle").value.trim(); if(!t) return;
  const r = await api("/api/new",{title:t, number:S.free_number}); $("#newtitle").value=""; await loadState(); openProject(r.id); };

async function openProject(id){ P = await api("/api/project?id="+encodeURIComponent(id)); lastResult=null; editing=null; renderSide(); render(); }
async function save(fields){ P = await api("/api/save", Object.assign({id:P.id}, fields)); renderRoundsStatus(); }

function render(){
  page = "project";
  const m = $("#main");
  const langOpts = S.languages.map(l=>`<option value="${l.code}" ${P.language===l.code?"selected":""}>${esc(l.name)} (${l.code})${l.voice?esc(T(" · host voice")):""}</option>`).join("");
  m.innerHTML = `
  <div class="head"><div><h2>${esc(P.title)}</h2><div class="sub">${esc(T("Pack #{0} · {1} questions", P.number, P.counts.standard+P.counts.picture+P.counts.all_that_apply+P.counts.point_stealer))}</div></div></div>

  <section class="step"><header><span class="num">1</span><h3>${esc(T("Pack"))}</h3><span class="hint">${esc(T("How it appears in the game's menus"))}</span></header>
    <div class="grid">
      <label class="f">${esc(T("Name"))}<input type="text" id="f-title" value="${esc(P.title)}"></label>
      <label class="f">${esc(T("Channel"))}<select id="f-cat">${S.categories.map(c=>`<option ${P.category===c?"selected":""}>${c}</option>`).join("")}</select></label>
      <label class="f">${esc(T("Language"))}<select id="f-lang">${langOpts}</select></label>
      <label class="f">${esc(T("Made by"))}<input type="text" id="f-author" value="${esc(P.author)}" placeholder="${esc(T("optional, shown in the credits"))}"></label>
      <label class="f">${esc(T("Pack number"))}<input type="number" id="f-num" min="1" max="999" value="${P.number}"></label>
    </div>
    <div id="gametarget" class="muted" style="font-size:.82rem;margin:.3rem 0"></div>
    <div class="muted" style="font-size:.8rem">${esc(T("Every pack needs its own number. Installing a pack replaces any other pack with the same number, so the app won't let you pick one that's already installed in RPCS3 or used by another of your packs."))}</div>
    <div id="numwarn"></div>
    <label class="f">${esc(T("Description"))}<input type="text" id="f-desc" value="${esc(P.description)}"></label>
    <label class="switch"><input type="checkbox" id="f-audio" ${P.audio?"checked":""}> ${esc(T("Host reads the questions aloud"))} <span class="muted" id="voicenote"></span></label>
    <label class="switch"><input type="checkbox" id="f-upper" ${P.uppercase?"checked":""}> ${esc(T("All capitals, like the game's own packs"))} <span class="muted">${esc(P.uppercase?T("(switching off keeps the case of questions you add from then on)"):T("(questions keep their own case)"))}</span></label>
  </section>

  <section class="step"><header><span class="num">2</span><h3>${esc(T("Questions"))}</h3><span class="hint">${esc(T("Import files or online sources, or write your own"))}</span></header>
    <div class="tabs" id="qtabs">${["import","add","list"].map(t=>`<button data-t2="${t}" class="${qtab===t?"on":""}">${esc({import:T("Import"),add:T("Write a question"),list:T("All questions ({0})", P.questions.length)}[t])}</button>`).join("")}</div>
    <div id="qbody"></div>
  </section>

  <section class="step"><header><span class="num">3</span><h3>${esc(T("Rounds"))}</h3><span class="hint">${esc(T("Running order when this pack is played from the Pack Game menu"))}</span></header>
    <div class="row"><span class="label">${esc(T("Preset"))}</span><select id="preset"><option value="">${esc(T("Choose a preset…"))}</option>${Object.keys(S.presets).map(k=>`<option value="${esc(k)}">${esc(T(k))}</option>`).join("")}</select></div>

function voiceNote(){
  const l = S.languages.find(x=>x.code===P.language);
  const note = !P.audio ? T("(off: silent host)") : (l && l.voice ? T("(voice: {0})", l.voice) : T("(no {0} host voice yet: the pack will be silent)", P.language));
  $("#voicenote").textContent = note;
  // which game this language's pack is for, and where it installs - visible before Generate
  const games = (l && l.builds && l.builds.length) ? l.builds.join(" / ") : null;
  const n = (P.rounds4p||[]).length;
  $("#gosummary").textContent = `${l?l.name:P.language} · ${P.audio && l && l.voice ? T("with host voice") : T("no audio")} · ${n===1 ? T("1 round + Final Countdown") : T("{0} rounds + Final Countdown", n)}`;
  const gt = $("#gametarget");
  if (gt) gt.innerHTML = !l ? "" : games
    ? `${esc(T("Plays on: "))}<b>${esc(games)}</b> <span class="muted">${esc(T("(installs into {0})", l.dlc||"?"))}</span>`
    : `<span class="warn">${esc(T("No known Buzz build uses {0} - this pack cannot be installed.", P.language))}</span>`;
}

// ---------- hear the host read a question (same voice and cache as Generate)
let player = null;
async function listen(text, btn){
  text = (text||"").trim(); if(!text) return toast(T("Write the question first"), true);
  if(player){ player.pause(); player = null; }
  const label = btn.textContent; btn.disabled = true; btn.textContent = "⏳";
  const slow = setTimeout(()=>toast(T("The host is reading… the first line takes about a minute while the voice loads")), 1500);
  try{
    const r = await api("/api/listen", {id:P.id, text});
    let j; do { await new Promise(res=>setTimeout(res, 800)); j = await api("/api/job?id="+r.job); } while(!j.done);
    if(j.error) return toast(j.error, true);
    player = new Audio(j.result.audio); player.play();
  } catch(e) {} finally { clearTimeout(slow); btn.disabled = false; btn.textContent = label; }
}
function head(){ $(".head .sub").textContent = T("Pack #{0} · {1} questions", P.number, P.questions.length); $("#qtabs [data-t2=list]").textContent=T("All questions ({0})", P.questions.length); loadState(); }
function counter(inp, out, max){ const u=()=>{out.textContent=`${inp.value.length}/${max}`; out.classList.toggle("over", inp.value.length>max);}; inp.oninput=u; u(); }
async function importFiles(list){ if(!list.length) return; const files=[]; for(const f of list) files.push(await readFile(f)); doImport({files}); }
async function doImport(body){
  $("#impres").textContent = T("Importing…");
  const r = await api("/api/import", Object.assign({id:P.id}, body));
  P = r.project;
  const sk = Object.entries(r.skipped).map(([k,v])=>`${v} ${T(k)}`).join(", ");
  $("#impres").innerHTML = T("<b>{0} added</b> of {1} found", r.added, r.found) + (sk ? esc(T(" · skipped: {0}", sk)) : "");
  renderRoundsStatus(); head();
}
async function addQuestion(){
  const body = {id:P.id, kind:addKind, question:$("#aq").value.trim()};
  if(editing){
    body.i = editing.i;
    if(addKind!=="point_stealer"){
      body.answers=[0,1,2,3].map(i=>$("#aa"+i).value.trim());
      if(addKind==="all_that_apply") body.right=[0,1,2,3].map(i=>$("#ar"+i).checked);
      if(addKind==="picture"){ const f=$("#aimg").files[0]; if(f) body.image=await readFile(f); }
    }
    P = await api("/api/edit", body); editing=null; qtab="list"; toast(T("Question updated")); render(); head(); return;
  }
  if(addKind==="point_stealer"){
    body.images=[]; for(let i=0;i<4;i++){ const f=$("#psi"+i).files[0]; if(!f) return toast(T("Add all four pictures"),true); body.images.push(await readFile(f)); }
    body.correct = +document.querySelector("input[name=psc]:checked").value;
  } else {
    body.answers=[0,1,2,3].map(i=>$("#aa"+i).value.trim());
    if(addKind==="all_that_apply") body.right=[0,1,2,3].map(i=>$("#ar"+i).checked);
    if(addKind==="picture"){ const f=$("#aimg").files[0]; if(!f) return toast(T("Choose a picture"),true); body.image=await readFile(f); }
  }
  P = await api("/api/add", body); toast(T("Question added")); renderQ(); renderRoundsStatus(); head();
}

// ---------- rounds
const roundNames = () => S.round_types.map(r=>r.name);
function renderTracks(){ ["4p","8p"].forEach(pl=>renderTrack(pl)); }
function renderTrack(pl){
  const steps = (P["rounds"+pl]||[]).map(s=>typeof s==="string"?s:{random:[...s.random]});
  const el = $("#track"+pl);
  const none = new Set(P.rounds_status.filter(r=>r.state==="none").map(r=>r.name));
  const opts = sel => roundNames().filter(n=>n!=="Final Countdown").map(n=>`<option value="${n}" ${n===sel?"selected":""}>${n}${none.has(n)?esc(T(" (no questions)")):""}</option>`).join("");
  el.innerHTML = steps.map((s,i)=>`<div class="card" data-i="${i}"><div class="top"><span>${esc(T("Round {0}", i+1))}${typeof s==="string"?"":esc(T(" · random"))}</span><span class="tools"><button data-a="left" aria-label="${esc(T("Move earlier"))}">◀</button><button data-a="right" aria-label="${esc(T("Move later"))}">▶</button><button data-a="del" aria-label="${esc(T("Remove"))}">✕</button></span></div>${
    typeof s==="string" ? `<select data-a="pick">${opts(s)}</select>` :
    `<div class="chips">${roundNames().filter(n=>n!=="Final Countdown").map(n=>`<span class="chip ${s.random.includes(n)?"on":""} ${none.has(n)?"dim":""}" title="${none.has(n)?esc(T("No questions for this round yet")):""}" data-a="toggle" data-n="${esc(n)}">${n}</span>`).join("")}</div>`}</div>`).join("") +
    `<div class="card fixed"><div class="top"><span>${esc(T("Last round"))}</span></div><b>Final Countdown</b></div>
     <div class="card fixed" style="gap:6px"><button class="btn small" data-a="addr">${esc(T("+ Round"))}</button><button class="btn small" data-a="addx">${esc(T("+ Random pick"))}</button></div>`;
  $("#count"+(pl==="4p"?"4":"8")).textContent = steps.length ? (steps.length===1 ? T("1 round + Final Countdown") : T("{0} rounds + Final Countdown", steps.length)) : T("game default (no custom order)");
  const commit = ns => save({["rounds"+pl]:ns}).then(()=>{renderTrack(pl); renderRoundsStatus();});
  el.querySelectorAll("[data-a]").forEach(c=>{
    const card=c.closest("[data-i]"); const i=card?+card.dataset.i:-1; const a=c.dataset.a;
    if(a==="pick") c.onchange=()=>{steps[i]=c.value; commit(steps);};
    else c.onclick=()=>{
      if(a==="del") steps.splice(i,1);
      else if(a==="left"&&i>0) [steps[i-1],steps[i]]=[steps[i],steps[i-1]];
      else if(a==="right"&&i<steps.length-1) [steps[i+1],steps[i]]=[steps[i],steps[i+1]];
      else if(a==="toggle"){ const n=c.dataset.n, r=steps[i].random; const k=r.indexOf(n); if(k>=0){ if(r.length>1) r.splice(k,1); } else r.push(n); }
      else if(a==="addr") steps.push("Point Builder");
      else if(a==="addx") steps.push({random:["Pie Fight","Pass the Bomb"]});
      commit(steps);
    };
  });
}
function renderRoundsStatus(){
  const el=$("#rstatus"); if(!el) return;
  const used = new Set([...(P.rounds4p||[]),...(P.rounds8p||[])].flatMap(s=>typeof s==="string"?[s]:s.random).concat(["Final Countdown"]));
  const bad = P.rounds_status.filter(r=>r.state==="none" && used.has(r.name)).map(r=>r.name);
  $("#rwarn").innerHTML = bad.length ? `<div class="warn">${esc(bad.length>1
    ? T("{0} have no questions in this pack yet. Add some (Point Stealer needs picture answers) or take them out of the running order.", bad.join(", "))
    : T("{0} has no questions in this pack yet. Add some (Point Stealer needs picture answers) or take it out of the running order.", bad[0]))}</div>` : "";
  el.innerHTML = P.rounds_status.map(r=>`<div style="${used.has(r.name)?"":"opacity:.6"}"><span>${r.name}</span><span class="pill ${r.state}">${r.state==="none"?esc(T("none")):r.questions+(r.state==="low"?esc(T(" (repeats)")):"")}</span></div>`).join("");
  voiceNote();
}

// ---------- generate
function numWarn(){
  const c = P.number_conflicts || [], el = $("#numwarn"), go = $("#gobtn");
  if(el) el.innerHTML = c.length ? `<div class="warn">${T("{0}. Pick another number, for example {1}.", c.map(esc).join("<br>"), P.free_number)}</div>` : "";
  if(go){ go.disabled = c.length>0; go.title = c.length ? T("Pick a free pack number in step 1 first") : ""; }
}
async function startGenerate(){
  const btn=$("#gobtn"); btn.disabled=true; lastResult=null;
  $("#golog").innerHTML=`<div class="log" id="logbox">${esc(T("Starting…"))}</div>`;
  const r = await api("/api/generate",{id:P.id}).catch(()=>{btn.disabled=false;});
  if(!r) return;
  const poll = async()=>{
    const j = await api("/api/job?id="+r.job);
    const lb = $("#logbox"); if(lb) lb.textContent = j.log.join("\n") || T("Working…");
    if(!j.done) return setTimeout(poll, 1000);
    btn.disabled=false;
    if(j.result){ lastResult=j.result; showResult(j.result); P = await api("/api/project?id="+P.id); }
  };
  poll();
}
function showResult(res){
  const box=document.createElement("div"); box.className="result";
  box.innerHTML = `<b>${esc(T("PKG ready"))}</b><code>${esc(res.pkg)}</code>
    <div class="muted">${esc(T("{0} · pack #{1} · {2} voiced lines · {3}", res.language, res.pack_number, res.voiced, res.voice))}</div>
    <div class="muted">${T("Install it in RPCS3 with <b>File → Install Packages/Raps/Edats</b>, or on a modded PS3 with the package installer.")}</div>
    <div class="row"><button class="btn" id="openf">${esc(T("Open folder"))}</button><button class="btn" id="inst">${esc(T("Copy straight into RPCS3"))}</button></div>`;
  $("#golog").appendChild(box);
  $("#openf").onclick=()=>api("/api/open",{path:res.pkg});
  $("#inst").onclick=async()=>{const r=await api("/api/install",{result:res});
    toast(T("Installed into {0}: {1}", r.game_name||r.dlc_title, r.installed));};
}

// ---------- online server page
let srvTimer = null;
async function srvPill(){ try{ const st = await api("/api/server",{op:"status"}); const p=$("#srvpill"); p.textContent = st.running?T("running"):T("stopped"); p.className = "pill "+(st.running?"ok":"none"); return st; }catch(e){} }
$("#srvbtn").onclick = ()=>{ P=null; renderSide(); renderServer(); };
async function renderServer(st){
  page = "server";
  st = st || await api("/api/server",{op:"status"});
  srvPill();
  const m=$("#main");
  const swap = `${st.hostname}=${st.lan_ip}`;
  m.innerHTML = `
  <div class="head"><div><h2>${esc(T("Online server"))}</h2><div class="sub">${esc(T("Your own Buzz! server: MyBuzz online quizzes, leaderboards and buddies for you and your friends"))}</div></div></div>
  <section class="step"><header><h3>${esc(T("Server"))}</h3><span class="hint"><span class="pill ${st.running?"ok":"none"}">${esc(st.running?T("Running"):T("Stopped"))}</span></span></header>
    ${st.configured ? "" : `<div class="warn">${T("One-time setup: the server needs a value from your own copy of the game. In RPCS3 use <b>Utilities → Decrypt PS3 Binaries</b> on the game's EBOOT.BIN, then give the .elf here.")}</div>
      <label class="f">${esc(T("Decrypted EBOOT (.elf)"))}<div class="row"><input type="text" id="eboot" placeholder="…\\EBOOT.elf" style="flex:1"><button class="btn primary" id="setupbtn">${esc(T("Set up server"))}</button></div></label>`}
    <div class="row">${st.running ? `<button class="btn" id="stopbtn" ${st.managed?"":`disabled title="${esc(T("Started outside the Studio"))}"`}>${esc(T("Stop server"))}</button>` : `<button class="btn primary" id="startbtn" ${st.configured?"":"disabled"}>${esc(T("Start server"))}</button>`}
      <span class="muted">${esc(T("Ports "))}${Object.entries(st.ports).map(([p,u])=>`${p} ${u?"✓":"✗"}`).join(" · ")}</span></div>
    <div class="log">${esc((st.log||[]).join("\n")) || esc(T("No server log yet."))}</div>
  </section>
  <section class="step"><header><h3>${esc(T("Play with friends"))}</h3><span class="hint">${esc(T("Each player sets this in RPCS3"))}</span></header>
    <div>${T("Friends on your network put this in RPCS3 → <b>Configuration → Network → IP swap list</b> (you use {0}):", `<code>${esc(st.hostname)}=127.0.0.1</code>`)}</div>
    <div class="row"><code style="font-size:1rem;padding:6px 10px;background:var(--soft);border-radius:8px">${esc(swap)}</code><button class="btn small" id="copyswap">${esc(T("Copy"))}</button></div>
    <div class="muted">${esc(T("Over the internet: forward TCP ports 10060, 10071 and 10075 on your router to this PC and give friends your public IP instead. Everyone needs a free RPCN account (RPCS3 → Configuration → RPCN)."))}</div>
    <div class="grid" style="align-items:end">
      <label class="f">${esc(T("This PC plays on the server at"))}<input type="text" id="srvip" value="127.0.0.1"></label>
      <label class="switch"><input type="checkbox" id="fps60" checked> ${esc(T("60 FPS patch"))}</label>
      <button class="btn primary" id="setuppc">${esc(T("Set up this PC for online play"))}</button>
    </div>
    <div class="muted" style="font-size:.85rem">${esc(T("Applies the login fix to your game's scripts, enables the RPCS3 patch the server needs, and sets RPCS3's network options (Internet on, PSN = RPCN, IP swap). Every changed file is backed up first."))}</div>
    <div id="setupres"></div>
  </section>
  <section class="step"><header><h3>${esc(T("Online quizzes"))}</h3><span class="hint">${esc(T("What your server offers in MyBuzz"))}</span></header>
    <div class="qwrap"><table class="qtable"><thead><tr><th>${esc(T("Pack"))}</th><th>${esc(T("Quizzes"))}</th><th>${esc(T("From"))}</th><th>${esc(T("On"))}</th></tr></thead><tbody>${
      (st.published||[]).map(p=>`<tr><td>${esc(p.pack)}</td><td>${p.quizzes}</td><td class="muted">${esc(p.project?T("Studio: {0}", p.project):T("catalogue file {0}", p.file))}</td><td><input type="checkbox" data-file="${esc(p.file)}" ${p.enabled?"checked":""} aria-label="${esc(T("Offer {0} online", p.pack))}"></td></tr>`).join("") || `<tr><td colspan="4" class="muted">${esc(T("Nothing published yet: use \"Publish to MyBuzz\" on a pack."))}</td></tr>`}</tbody></table></div>
  </section>`;
  const b=(id,fn)=>{const e=$("#"+id); if(e) e.onclick=fn;};
  b("startbtn", async()=>{ renderServer(await api("/api/server",{op:"start"})); setTimeout(()=>renderServer(),2500); });
  b("stopbtn", async()=>renderServer(await api("/api/server",{op:"stop"})));
  b("setupbtn", async()=>{ renderServer(await api("/api/server",{op:"setup",eboot:$("#eboot").value.trim()})); toast(T("Server set up")); });
  b("copyswap", ()=>{ navigator.clipboard.writeText(swap); toast(T("Copied")); });
  b("setuppc", async()=>{ const r=await api("/api/setup_pc",{server_ip:$("#srvip").value.trim(),fps60:$("#fps60").checked}); $("#setupres").innerHTML=`<div class="result"><b>${esc(T("Done"))}</b>${r.done.map(x=>`<div>✓ ${esc(x)}</div>`).join("")}<div class="muted">${esc(T("Restart the game in RPCS3 for this to take effect."))}</div></div>`; });
  m.querySelectorAll("[data-file]").forEach(c=>c.onchange=()=>api("/api/catalog",{file:c.dataset.file,enabled:c.checked}));
  clearTimeout(srvTimer); srvTimer=setTimeout(()=>{ if(!P && page==="server") renderServer(); }, 5000);
}

let bbTimer;
async function bbPill(){ try{ const st = await api("/api/buzzers",{op:"status"}); const p=$("#bbpill"); p.textContent = st.running?T("on"):T("off"); p.className = "pill "+(st.running?"ok":"none"); return st; }catch(e){} }
$("#bbbtn").onclick = ()=>{ P=null; renderSide(); renderBuzzers(); };
const BB_RECEIVER = {ok:[1,"Receiver found"], running:[1,"Receiver found and in use by the buzzers"],
  missing:[0,"Receiver not found: plug in the Big Button IR receiver"],
  no_driver:[0,"The receiver needs the WinUSB driver: install it once with Zadig (see the README)"],
  no_library:[0,"USB library missing: run Install.bat again"]};
async function renderBuzzers(st){
  page = "buzzers";
  st = st || await api("/api/buzzers",{op:"status"});
  bbPill();
  const tick=(ok,t)=>`<div>${ok?"✓":"✗"} ${esc(t)}</div>`;
  const rc = BB_RECEIVER[st.receiver] || [0, st.receiver];
  $("#main").innerHTML = `
  <div class="head"><div><h2>${esc(T("Big Button buzzers"))}</h2><div class="sub">${esc(T("Use Xbox 360 Big Button (Scene It) pads as the Buzz! buzzers in RPCS3"))}</div></div></div>
  <section class="step"><header><h3>${esc(T("Buzzers"))}</h3><span class="hint"><span class="pill ${st.running?"ok":"none"}">${esc(st.running?T("Running"):T("Stopped"))}</span></span></header>
    <label class="switch"><input type="checkbox" id="bbtoggle" ${st.running?"checked":""}> ${esc(T("Big Button buzzers on"))}</label>
    <div>${tick(rc[0], T(rc[1]))}${st.titles.length ? tick(1, T("RPCS3 input profile: {0}", st.titles.join(", "))) : tick(0, T("Open Buzz! once in RPCS3 so it creates an input profile"))}${st.mapped.length ? tick(1, T("Players 1-4 mapped to the pads in: {0}", st.mapped.join(", "))) : `<div class="muted">${esc(T("Players 1-4 are mapped to the pads when you switch on."))}</div>`}</div>
    <div class="muted">${esc(T("Keep the RPCS3 game window in front while you play: the pads type keys, and RPCS3 only reads the keyboard while it has focus. Switching off puts your previous RPCS3 controller settings back."))}</div>
    <div class="log">${esc((st.log||[]).join("\n")) || esc(T("Press a button on a pad to see it here once the buzzers are on."))}</div>
  </section>
  <section class="step"><header><h3>${esc(T("How it works"))}</h3><span class="hint">${esc(T("Pad → PC → RPCS3 → game"))}</span></header>
    <ol>
      <li>${esc(T("The IR receiver passes every pad's presses to this PC over USB."))}</li>
      <li>${esc(T("The bridge turns each pad's buttons into keys: pad 1 uses 1-7, pad 2 Q-U, pad 3 A-J, pad 4 Z-M; the d-pad is the arrow keys on every pad."))}</li>
      <li>${esc(T("RPCS3 players 1-4 are set to the keyboard with those keys."))}</li>
      <li>${esc(T("RPCS3's Buzz! emulation (1 controller = 4 buzzers) hands players 1-4 to the game as buzzers 1-4."))}</li>
    </ol>
    <div class="qwrap"><table class="qtable"><thead><tr><th>${esc(T("Pad button"))}</th><th>${esc(T("Buzzer button"))}</th></tr></thead><tbody>
      ${[["Big button","Red buzzer"],["X (blue)","Blue"],["B (red)","Orange"],["A (green)","Green"],["Y (yellow)","Yellow"],["Start / Back / d-pad","Menus"]].map(([a,b])=>`<tr><td>${esc(T(a))}</td><td>${esc(T(b))}</td></tr>`).join("")}
    </tbody></table></div>
  </section>`;
  $("#bbtoggle").onchange = async e=>{
    try{ renderBuzzers(await api("/api/buzzers",{op: e.target.checked?"start":"stop"})); }
    catch(err){ renderBuzzers(); }
  };
  clearTimeout(bbTimer); bbTimer=setTimeout(()=>{ if(!P && page==="buzzers") renderBuzzers(); }, 2000);
}

loadState().then(()=>{ srvPill(); bbPill(); const u=new URLSearchParams(location.search); const q=u.get("p"); if(q) openProject(q); else if(u.get("page")==="server") renderServer(); else if(u.get("page")==="buzzers") renderBuzzers(); });
</script>
